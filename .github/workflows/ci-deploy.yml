name: Deploy project

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
permissions: read-all

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

jobs:
  stage-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: linux-x86_64-java8
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.18.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.18.yaml run stage-snapshot"
            artifact-paths: |
              ~/local-staging/io/netty/netty-transport-native-epoll/*/*.jar
              !~/local-staging/io/netty/netty-transport-native-epoll/*/*-javadoc.jar
              !~/local-staging/io/netty/netty-transport-native-epoll/*/*-sources.jar
          - setup: linux-aarch64
            docker-compose-build: "-f docker/docker-compose.centos-7.yaml build"
            docker-compose-run: "-f docker/docker-compose.centos-7.yaml run cross-compile-aarch64-stage-snapshot"
            artifact-paths: ~/local-staging/io/netty/netty-transport-native-epoll/*/*-linux-aarch_64.jar
          - setup: linux-riscv64
            docker-compose-build: "-f docker/docker-compose.ubuntu-*.yaml build"
            docker-compose-run: "-f docker/docker-compose.ubuntu-*.yaml run cross-compile-riscv64-stage-snapshot"
            artifact-paths: ~/local-staging/io/netty/netty-transport-native-epoll/*/*-linux-riscv64.jar

    name: stage-snapshot-${{ matrix.setup }}
    steps:
      - uses: actions/checkout@v4

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.setup }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.setup }}-
            ${{ runner.os }}-maven-

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Build docker image
        run: docker compose ${{ matrix.docker-compose-build }}

      - name: Stage snapshots to local staging directory
        run: docker compose ${{ matrix.docker-compose-run }}

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.setup }}-local-staging
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
