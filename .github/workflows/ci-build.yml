name: Build project

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector"
        required: false
        default: ""

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: linux-x86_64-java11
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build"
          - setup: linux-x86_64-java11-boringssl
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build-handler-boringssl"
          - setup: linux-x86_64-java11-testsuite
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build-testsuite"

    name: ${{ matrix.setup }}
    steps:
      - uses: actions/checkout@v4

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.setup }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.setup }}-
            ${{ runner.os }}-maven-

      - name: Build docker image
        run: docker compose ${{ matrix.docker-compose-build }}

      - name: Build project without leak detection
        timeout-minutes: 50
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: docker compose ${{ matrix.docker-compose-run }} | tee build.output

      - name: Print skipped tests and their reasons
        if: always()
        run: |
          python3 - <<'PY'
          # Surefire only prints a per-class skip count. List every skipped test with its reason and, when
          # JUnit only says "assumption is not true/false", the assume*() condition from the test source.
          import glob
          import re
          import xml.etree.ElementTree as ET

          GENERIC = re.compile(r'^(Assumption failed: )?assumption is not (true|false)$|^$')

          sources = {}
          for path in glob.glob('**/src/test/java/**/*.java', recursive=True) + \
                  glob.glob('testsuite*/src/main/java/**/*.java', recursive=True):
              sources.setdefault(path.rsplit('/', 1)[-1][:-5], path)

          cache = {}


          def read(name):
              if name not in cache:
                  path = sources.get(name)
                  cache[name] = open(path, encoding='utf-8', errors='replace').read() if path else None
              return cache[name]


          def assumes(text):
              return [line.strip().rstrip(';') for line in text.splitlines() if 'assume' in line and '(' in line
                      and not re.match(r'\s*(import|public|private|protected|static|void)\b', line)]


          def method_bodies(text, method):
              bodies = []
              for match in re.finditer(r'\bvoid\s+' + re.escape(method) + r'\s*\(', text):
                  start = text.find('{', match.end())
                  if start < 0:
                      continue
                  depth = 0
                  for i in range(start, len(text)):
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              bodies.append(text[start:i + 1])
                              break
              return bodies


          def explain(classname, method):
              chain = []
              simple = classname.rsplit('.', 1)[-1].split('$')[0]
              while simple and simple not in [c for c, _ in chain]:
                  text = read(simple)
                  if text is None:
                      break
                  chain.append((simple, text))
                  parent = re.search(r'\bclass\s+' + re.escape(simple) + r'\b[^{]*?\bextends\s+([A-Za-z0-9_]+)', text)
                  simple = parent.group(1) if parent else None
              if method:
                  for simple, text in chain:
                      found = [a for body in method_bodies(text, method) for a in assumes(body)]
                      if found:
                          return '%s.%s: %s' % (simple, method, '; '.join(dict.fromkeys(found)))
              for simple, text in chain:
                  found = assumes(text)
                  if found:
                      return '%s (class-level): %s' % (simple, '; '.join(list(dict.fromkeys(found))[:4]))
              return None


          FRAME = re.compile(r'at io\.netty\.[\w.$]+\((\w+)\.java:(\d+)\)')


          def failed_line(trace):
              for simple, line in FRAME.findall(trace or ''):
                  text = read(simple)
                  if text is not None:
                      lines = text.splitlines()
                      if int(line) <= len(lines):
                          return '%s.java:%s: %s' % (simple, line, lines[int(line) - 1].strip().rstrip(';'))
              return None


          reports = glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)
          reports += glob.glob('**/target/failsafe-reports/TEST-*.xml', recursive=True)
          run = failed = errored = skipped = 0
          for report in sorted(reports):
              for case in ET.parse(report).getroot().iter('testcase'):
                  run += 1
                  if case.find('failure') is not None:
                      failed += 1
                  if case.find('error') is not None:
                      errored += 1
                  skip = case.find('skipped')
                  if skip is None:
                      continue
                  skipped += 1
                  reason = ' '.join((skip.get('message') or '').split())
                  classname, name = case.get('classname') or '', case.get('name') or ''
                  if GENERIC.match(reason):
                      at = failed_line(skip.text)
                      if at:
                          reason = '%s [failed assumption at %s]' % (reason or 'no message', at)
                      else:
                          method = re.split(r'[{\[(]', name, 1)[0]
                          source = explain(classname, None if method == classname else method)
                          if source:
                              reason = '%s [failed assumption in %s]' % (reason or 'no message', source)
                  elif reason.startswith('assumption was not met'):
                      at = failed_line(skip.text)
                      if at:
                          reason = '%s [failed assumption at %s]' % (reason, at)
                  print('SKIPPED %s.%s -- %s' % (classname, name, reason or 'no reason given'))
          print('Total skipped tests: %d' % skipped)
          print('Test totals over %d report files: run %d, passed %d, failures %d, errors %d, skipped %d'
                % (len(reports), run, run - failed - errored - skipped, failed, errored, skipped))
          PY

      - name: Checking for test failures
        run: ./.github/scripts/check_build_result.sh build.output

      - name: Checking bom dependency versions
        run: ./.github/scripts/check_bom_dependencies.sh

      - name: print JVM thread dumps when cancelled
        uses: ./.github/actions/thread-dump-jvms
        if: cancelled()

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: target
          path: |
            **/target/surefire-reports/
            **/hs_err*.log
